<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jenkins Pipeline - Exact Match</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
  body { background-color: #eaf1f8; padding: 40px 20px; display: flex; justify-content: center; }

  /* Full Orange Pipeline Background[cite: 13] */
  .pipeline-banner {
    background-color: #fcab36;
    padding: 16px 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 0 #d48a1b inset, 0 -1px 0 #d48a1b inset;
  }

  /* Universal Card styling */
  .card {
    height: 108px;
    border-radius: 2px;
    box-shadow: 3px 4px 6px rgba(0, 0, 0, 0.4);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Left Pipeline Selection Box[cite: 10] */
  .card-pipeline {
    width: 140px;
    background-color: #9d948a;
    border: 1px solid #6b645d;
    flex-direction: row;
  }
  .card-pipeline-main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-pipeline-header {
    background-color: #e3dbd3;
    text-align: center;
    padding: 5px 0;
    font-size: 13px;
    color: #222;
    border-bottom: 1px solid #7a726a;
  }
  .card-pipeline-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #222;
  }
  .card-pipeline-scroll {
    width: 17px;
    background-color: #fbaa35;
    border-left: 1px solid #ca841c;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 2px 0;
    font-size: 9px;
    color: #b36900;
  }

  /* Standard Stage Card Dimensions[cite: 13] */
  .card-stage { width: 255px; }

  /* Green Cards[cite: 11] */
  .card-green {
    background-color: #38d535;
    border: 1px solid #289c26;
  }
  .card-green .card-header {
    background-color: #c4f0c3;
    border-bottom: 1px solid #289c26;
  }

  /* Red Card[cite: 12] */
  .card-red {
    background-color: #ef3223;
    border: 1px solid #aa1d14;
  }
  .card-red .card-header {
    background-color: #f7bcbc;
    border-bottom: 1px solid #aa1d14;
  }

  /* Stage Content & Text */
  .card-stage .card-header {
    padding: 6px 8px;
    font-size: 13px;
    color: #222;
  }
  .card-body {
    padding: 6px 8px;
    font-size: 12px;
    color: #111;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .info-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  /* SVG Custom Icons aligned vertically */
  .custom-icon { width: 14px; height: 14px; display: block; }

  /* Bottom-Right Console and Play Buttons */
  .card-actions {
    position: absolute;
    bottom: 5px;
    right: 5px;
    display: flex;
    gap: 3px;
  }
  .btn-icon {
    width: 16px;
    height: 16px;
    border: 1px solid #111;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: bold;
    color: #111;
  }

  /* Arrow Separators */
  .arrow {
    font-size: 20px;
    color: #111;
    margin: 0 -2px;
  }
</style>
</head>
<body>

<div class="pipeline-banner">
  <!-- Pipeline Block[cite: 10] -->
  <div class="card card-pipeline">
    <div class="card-pipeline-main">
      <div class="card-pipeline-header">Pipeline</div>
      <div class="card-pipeline-body">#6</div>
    </div>
    <div class="card-pipeline-scroll">
      <span>▲</span>
      <span>▼</span>
    </div>
  </div>

  <div class="arrow">→</div>

  <!-- Stage 1: Build[cite: 9, 13] -->
  <div class="card card-stage card-green">
    <div class="card-header">#6 MavenWeb_Build</div>
    <div class="card-body">
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <rect x="1" y="1" width="12" height="12" rx="1" fill="#e0e0e0" stroke="#7a7a7a" stroke-width="0.8"/>
          <rect x="1.4" y="1.4" width="11.2" height="3" fill="#8cb4e2"/>
          <line x1="3" y1="6" x2="11" y2="6" stroke="#999" stroke-width="1"/>
          <line x1="3" y1="8" x2="11" y2="8" stroke="#999" stroke-width="1"/>
          <line x1="3" y1="10" x2="9" y2="10" stroke="#999" stroke-width="1"/>
        </svg>
        <span>28-Sept-2026 6:28:51 pm</span>
      </div>
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <circle cx="7" cy="7" r="5" fill="#8cb4e2" stroke="#555" stroke-width="0.8"/>
          <circle cx="7" cy="7" r="3.5" fill="#fff"/>
          <line x1="7" y1="7" x2="7" y2="4.5" stroke="#333" stroke-width="1"/>
          <line x1="7" y1="7" x2="8.5" y2="7" stroke="#333" stroke-width="1"/>
          <path d="M 3.5 3.5 L 2 2 M 10.5 3.5 L 12 2" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M 4 12 L 3 13 M 10 12 L 11 13" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>33 sec</span>
      </div>
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <circle cx="7" cy="4.5" r="3" fill="#e6bca3"/>
          <path d="M 7 1.5 C 5 1.5 4 3 4 4.5 L 10 4.5 C 10 3 9 1.5 7 1.5 Z" fill="#6d4c41"/>
          <path d="M 2 13 C 2 9.5 4 8.5 7 8.5 C 10 8.5 12 9.5 12 13 Z" fill="#639be3" stroke="#4a80bd" stroke-width="0.5"/>
        </svg>
        <span>ayush1352</span>
      </div>
    </div>
    <div class="card-actions">
      <div class="btn-icon">&gt;_</div>
      <div class="btn-icon">▷</div>
    </div>
  </div>

  <div class="arrow">→</div>

  <!-- Stage 2: Test[cite: 11] -->
  <div class="card card-stage card-green">
    <div class="card-header">#6 MavenWeb_Test</div>
    <div class="card-body">
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <rect x="1" y="1" width="12" height="12" rx="1" fill="#e0e0e0" stroke="#7a7a7a" stroke-width="0.8"/>
          <rect x="1.4" y="1.4" width="11.2" height="3" fill="#8cb4e2"/>
          <line x1="3" y1="6" x2="11" y2="6" stroke="#999" stroke-width="1"/>
          <line x1="3" y1="8" x2="11" y2="8" stroke="#999" stroke-width="1"/>
          <line x1="3" y1="10" x2="9" y2="10" stroke="#999" stroke-width="1"/>
        </svg>
        <span>28-Sept-2026 6:31:58 pm</span>
      </div>
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <circle cx="7" cy="7" r="5" fill="#8cb4e2" stroke="#555" stroke-width="0.8"/>
          <circle cx="7" cy="7" r="3.5" fill="#fff"/>
          <line x1="7" y1="7" x2="7" y2="4.5" stroke="#333" stroke-width="1"/>
          <line x1="7" y1="7" x2="8.5" y2="7" stroke="#333" stroke-width="1"/>
          <path d="M 3.5 3.5 L 2 2 M 10.5 3.5 L 12 2" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M 4 12 L 3 13 M 10 12 L 11 13" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>12 sec</span>
      </div>
    </div>
    <div class="card-actions">
      <div class="btn-icon">&gt;_</div>
      <div class="btn-icon">▷</div>
    </div>
  </div>

  <div class="arrow">→</div>

  <!-- Stage 3: Deploy (Red)[cite: 12] -->
  <div class="card card-stage card-red">
    <div class="card-header">#8 MavenWeb_Deploy</div>
    <div class="card-body">
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <rect x="1" y="1" width="12" height="12" rx="1" fill="#e0e0e0" stroke="#7a7a7a" stroke-width="0.8"/>
          <rect x="1.4" y="1.4" width="11.2" height="3" fill="#8cb4e2"/>
          <line x1="3" y1="6" x2="11" y2="6" stroke="#999" stroke-width="1"/>
          <line x1="3" y1="8" x2="11" y2="8" stroke="#999" stroke-width="1"/>
          <line x1="3" y1="10" x2="9" y2="10" stroke="#999" stroke-width="1"/>
        </svg>
        <span>28-Sept-2026 6:48:40 pm</span>
      </div>
      <div class="info-row">
        <svg class="custom-icon" viewBox="0 0 14 14">
          <circle cx="7" cy="7" r="5" fill="#8cb4e2" stroke="#555" stroke-width="0.8"/>
          <circle cx="7" cy="7" r="3.5" fill="#fff"/>
          <line x1="7" y1="7" x2="7" y2="4.5" stroke="#333" stroke-width="1"/>
          <line x1="7" y1="7" x2="8.5" y2="7" stroke="#333" stroke-width="1"/>
          <path d="M 3.5 3.5 L 2 2 M 10.5 3.5 L 12 2" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M 4 12 L 3 13 M 10 12 L 11 13" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>2.2 sec</span>
      </div>
    </div>
    <div class="card-actions">
      <div class="btn-icon">&gt;_</div>
      <div class="btn-icon">▷</div>
    </div>
  </div>
</div>

</body>
</html>
